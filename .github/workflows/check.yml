# Everything that needs no browser: the type check, the unit tests, the
# architecture tests with their exemption list (tests/architecture/), and the
# library build. Real-WebGPU checks run on the Windows RTX 4090 through
# visionary-editor's browser runner.
name: check

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # package-lock.json is git-ignored here, so dependencies resolve afresh.
      - run: npm install --no-audit --no-fund
      - run: npm run check
